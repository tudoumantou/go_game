# 游戏服配置（prod 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: game-01
  env: prod
  grpc_addr: "0.0.0.0:9100"

actor:
  shard_count: 1024            # 2 的幂
  mailbox_size: 4096

mysql:
  dsn: "game:${MYSQL_PASSWORD}@tcp(mysql:3306)/game_study?parseTime=true"
  max_open_conns: 30           # 业务池 30（第 14 章推导）；flush 10 worker 错峰共享借还
  max_idle_conns: 10

redis:
  addrs: ["redis:6379"]
  pool_size: 100
  min_idle_conns: 20
  password: ""
  db: 0

  # 熔断（docs/缓存架构设计.md §9）：Redis 故障时快速失败，不让每条命令
  # 等满超时把降级路径拖死。连续 threshold 次失败后打开，cooldown 内所有
  # 命令直接返回错误（读回落 MySQL / 写只告警照常工作），冷却后放 1 个
  # 探测请求：成功关闭、失败重新打开。
  # 不写或全 0 = 默认开启（阈值 5 / 冷却 5s / 探测 1）；threshold: -1 = 关闭。
  circuit_breaker:
    threshold: 5
    cooldown: 5s
    probes: 1

kafka:
  brokers: ["kafka:9092"]
  producer_required_acks: all
  consumer_group: "game-server-01"   # 每实例独立组，分区按 playerID 有序

etcd:
  endpoints: ["etcd:2379"]
  lease_ttl: 10
  keepalive_interval: 3

center:                        # 中心服上报（控制面）
  addr: "center:9200"
  reconnect_max_wait: 30s
  report_buffer: 4096          # 积压时降频丢弃统计类消息

flush:                         # 10 分片分时落库（worker 共享连接池）
  shard_count: 10
  interval: 60s
  stagger: 6s
  batch_rows: 500
  dirty_ttl: 10m

replica:                       # Redis 副本异步回写（R14）：内存权威，副本只服务「别人读我」
  interval: 200ms              # 批量刷写周期（跨服/跨节点读到的新鲜度）
  max_batch: 256               # 单轮最多刷多少玩家（一轮 = 一次 pipeline RTT）
  max_pending: 100000          # 待刷上限，超限丢最旧的（Redis 长时间不可用时保内存）
  max_attempts: 300            # 单条最大重试次数，超过即丢弃并告警

idtab:
  build_page_size: 5000
  reconcile_interval: 10m      # 数量对账

  # 一对多索引（docs/缓存架构设计.md）：启动时建 by_owner:{table} 这个 ZSET。
  # 只有「一个归属者对应多行」的表需要配；一对一的（签到/属性/任务进度、
  # 当前实现的伙伴/装备都是单行 JSON）配了是纯浪费——按 player_id 一次查询就够。
  # key（主键列）必填：构建与预热都以它为分页游标；by 仅 preload_all 可省。
  #
  # v3.17 起这里不再是唯一声明处：模块通过 module.IndexDeclarer 在代码里
  # 声明自己要用哪个索引，组装层合并两个来源（代码声明缺的会补建，并记一条
  # "owner index declared by module" 的 Info 提示来补 yaml）。本配置降级为
  # 「部署开关」：这个环境建不建、要不要 preload_all。
  #
  # mail: 点开邮箱时按需展开（Members → 批量加载 → 回填）。
  #   消费方：internal/game/module/mail（listRows / indexAdd / onDelete）。
  #   登录展开入口已于 v3.9 删除（缓存架构设计 §4.2），配置项也在 v3.11 移除。
  mappings:
    - {table: mail, by: player_id, key: id}
  # 以下两项是「接下一对多功能」时的样板，模块未接入前不要打开：
  #   - {table: guild_member, by: guild_id,  key: id}
  #   - {table: guild,        key: id, preload_all: true}   # 未启用：当前没有需要整表预热的表

limit:                         # 限流：0 = 用内置默认（默认开启），负数 = 关闭该项
  packet_rate: 20              # 每连接每秒包数（网关）
  packet_burst: 40             # 每连接突发容量
  chat_interval_ms: 1000       # 聊天最小间隔（毫秒，游戏服）
  login_per_min: 20            # 每 IP 每分钟登录次数（登录服）

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:9102"

shutdown:
  total_timeout: 60s
  drain_timeout: 30s
  flush_timeout: 30s
