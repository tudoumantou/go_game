# 游戏服配置（dev 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: game-01
  id: 1                          # 区服 ID，写入登录服 user_role.server_id
  env: dev
  grpc_addr: "0.0.0.0:9100"

actor:
  shard_count: 1024            # 2 的幂
  mailbox_size: 4096

mysql:
  dsn: "game:game_study@tcp(127.0.0.1:3306)/game_study?parseTime=true"
  max_open_conns: 30           # 业务池 30（第 14 章推导）；flush 10 worker 错峰共享借还
  max_idle_conns: 10

redis:
  addrs: ["127.0.0.1:6379"]
  pool_size: 100
  min_idle_conns: 20
  password: ""
  db: 0

kafka:
  brokers: ["${KAFKA_BROKERS}"]
  producer_required_acks: all
  consumer_group: "game-server-01"   # 每实例独立组，分区按 playerID 有序

etcd:
  endpoints: ["127.0.0.1:2379"]
  lease_ttl: 10
  keepalive_interval: 3

cross:                         # 小组跨服节点（P8 前用静态配置；之后由 GroupUpdate 下发）
  nodes:
    - "127.0.0.1:9300"
  battle_timeout: 180s         # 单场战斗时限（超时按平局兜底结算）
  reconnect_max: 30s
  # 抢位置跨服房间所在节点（须属于 nodes）；留空则座位只在本服（单服模式）。

center:                        # 中心服上报（控制面）
  addr: "127.0.0.1:9200"
  reconnect_max_wait: 30s
  report_buffer: 4096          # 积压时降频丢弃统计类消息

flush:                         # 10 分片分时落库（worker 共享连接池）
  shard_count: 10
  interval: 60s
  stagger: 6s
  batch_rows: 500
  dirty_ttl: 10m

replica:                       # Redis 副本异步回写（R14）：内存权威，副本只服务「别人读我」
  interval: 200ms              # 批量刷写周期（跨服/跨节点读到的新鲜度）
  max_batch: 256               # 单轮最多刷多少玩家（一轮 = 一次 pipeline RTT）
  max_pending: 100000          # 待刷上限，超限丢最旧的（Redis 长时间不可用时保内存）
  max_attempts: 300            # 单条最大重试次数，超过即丢弃并告警

gamedata:                      # 配置表热更（R16）：改 JSON 不重启，文件名即表名
  dir: ""                      # 热更目录（*.json）；空 = 不热更，用编译期内嵌快照
  watch: true                  # 目录监听；false 时仍可用 SIGHUP 手动触发
  debounce: 200ms              # 事件去抖（编辑器一次保存通常产生 2~3 个事件）

idtab:
  build_page_size: 5000
  reconcile_interval: 10m      # 数量对账

  # 一对多索引（docs/缓存架构设计.md §3）：只有「一个归属者多行」的表需要配。
  # v3.17 起模块在代码里用 module.IndexDeclarer 声明，这里只做部署开关
  # （漏配也会被 attachOwnerIndexes 补建，并记 Info 日志）。
  # mail 由模块在 onList 里按需展开（登录展开入口已在 v3.9 删除）。
  mappings:
    - {table: mail, by: player_id, key: id}

limit:                         # 限流：0 = 用内置默认（默认开启），负数 = 关闭该项
  packet_rate: 20              # 每连接每秒包数（网关）
  packet_burst: 40             # 每连接突发容量
  chat_interval_ms: 1000       # 聊天最小间隔（毫秒，游戏服）
  login_per_min: 20            # 每 IP 每分钟登录次数（登录服）

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:9102"

shutdown:
  register_drain: 3s            # 摘注册后等网关感知，再停 RPC（滚动发布）
  total_timeout: 60s
  drain_timeout: 30s
  flush_timeout: 30s
