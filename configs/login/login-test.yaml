# 登录服配置（test 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: login-01
  env: test
  http_addr: "0.0.0.0:8080"
  tls_cert: "/etc/game_study/login.pem"
  tls_key: "/etc/game_study/login.key"

token:
  ttl: 24h
  rsa_private_key: "/etc/game_study/login_rsa.pem"   # 签发 Token 用，与网关握手密钥分离

redis:
  addrs: ["198.51.100.11:6379", "198.51.100.12:6379", "198.51.100.13:6379"]
  pool_size: 50
  min_idle_conns: 10

mysql:                          # 账号/角色元信息（Tier-1 直连）
  dsn: "game:${MYSQL_PASSWORD}@tcp(198.51.100.21:3306)/game_study?parseTime=true"
  max_open_conns: 20
  max_idle_conns: 5

kafka:                          # 充值订单生产
  brokers: ["198.51.100.51:9092", "198.51.100.52:9092", "198.51.100.53:9092"]
  producer_required_acks: all
  consumer_group: "login-server"

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:8081"

shutdown:
  total_timeout: 30s
  drain_timeout: 10s
