# 登录服配置（dev 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: login-01
  env: dev
  http_addr: "0.0.0.0:8080"
  tls_cert: "/etc/game_study/login.pem"
  tls_key: "/etc/game_study/login.key"

# 支付渠道（R3.3）：sandbox = HMAC 模拟渠道，仅供联调；生产接入真实渠道后改 channel。
# sandbox_secret 留空时服务能启动但所有回调验签失败（等价于关闭充值回调）。
pay:
  channel: sandbox
  sandbox_secret: "dev-sandbox-secret-change-me"
  sign_window: 5m

token:
  ttl: 24h
  rsa_private_key: "/etc/game_study/login_rsa.pem"   # 签发 Token 用，与网关握手密钥分离

redis:
  addrs: ["127.0.0.1:6379"]
  pool_size: 50
  min_idle_conns: 10
  password: ""
  db: 0

mysql:                          # 账号/角色元信息（Tier-1 直连）
  dsn: "game:game_study@tcp(127.0.0.1:3306)/game_study?parseTime=true"
  max_open_conns: 20
  max_idle_conns: 5

kafka:                          # 充值订单生产
  brokers: ["${KAFKA_BROKERS}"]
  producer_required_acks: all
  consumer_group: "login-server"

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:8081"

shutdown:
  total_timeout: 30s
  drain_timeout: 10s
