# 登录服配置（prod 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: login-01
  env: prod
  http_addr: "0.0.0.0:8080"
  tls_cert: "/etc/game_study/login.pem"
  tls_key: "/etc/game_study/login.key"

token:
  ttl: 24h
  rsa_private_key: "/etc/game_study/login_rsa.pem"   # 签发 Token 用，与网关握手密钥分离

redis:
  addrs: ["192.0.2.51:6379", "192.0.2.52:6379", "192.0.2.53:6379"]
  pool_size: 50
  min_idle_conns: 10
  password: ""
  db: 0

mysql:                          # 账号/角色元信息（Tier-1 直连）
  dsn: "game:${MYSQL_PASSWORD}@tcp(192.0.2.54:3306)/game_study?parseTime=true"
  max_open_conns: 20
  max_idle_conns: 5

kafka:                          # 充值订单生产
  brokers: ["192.0.2.55:9092", "192.0.2.56:9092", "192.0.2.57:9092"]
  producer_required_acks: all
  consumer_group: "login-server"

limit:                         # 限流：0 = 用内置默认（默认开启），负数 = 关闭该项
  packet_rate: 20              # 每连接每秒包数（网关）
  packet_burst: 40             # 每连接突发容量
  chat_interval_ms: 1000       # 聊天最小间隔（毫秒，游戏服）
  login_per_min: 20            # 每 IP 每分钟登录次数（登录服）

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:8081"

shutdown:
  total_timeout: 30s
  drain_timeout: 10s
