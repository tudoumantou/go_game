# 中心服配置（dev 环境）
# 设计文档 19.1；敏感信息（MySQL DSN 等）用 ${VAR} 环境变量注入，不入库。
# 端口规划：见 19.1 端口表（登录 8080/8081，网关 9001/9101，游戏 9100/9102，
# 中心 9200/9201，跨服 9300/9301）。
server:
  name: center-01
  env: dev
  group: group-01              # 跨服分组；game 与 center 必须一致
  grpc_addr: "0.0.0.0:9200"

etcd:
  endpoints: ["127.0.0.1:2379"]
  lease_ttl: 10
  keepalive_interval: 3
  leader_key: "/game_study/leader/center"   # 选主

cross:                         # 组内跨服节点（匹配时分配给游戏服；生产由运营配置下发）
  nodes:
    - "127.0.0.1:9300"

report:
  heartbeat_interval: 5s       # 期望节点心跳间隔
  heartbeat_timeout: 15s       # 超时判定不可用

rank:
  snapshot_interval: 5m        # 排行榜快照间隔
  archive_cron: "0 0 * * *"    # 保留字段；实际由「赛季到期」判定（archive.Service）
  season_days: 30              # 赛季长度；到期由 leader 归档并切赛季
  archive_top_n: 1000          # 归档前 N 名
  rank_types: [arena_score]    # 需要归档的榜单
  reward_top: 0                # 前 N 名发赛季奖励（0 = 不发）
  reward_item_id: 1001
  reward_count: 500

stats:
  aggregate_windows: [1m, 5m, 1h, 1d]
  snapshot_interval: 5m
  mysql_shard: 10              # 统计落库分片

kafka:                         # 归档奖励邮件（gs.mail）的发送通道
  brokers: ["${KAFKA_BROKERS}"]


redis:
  addrs: ["127.0.0.1:6379"]
  pool_size: 50
  min_idle_conns: 10
  password: ""
  db: 0

mysql:
  dsn: "game:game_study@tcp(127.0.0.1:3306)/game_study?parseTime=true"
  max_open_conns: 20
  max_idle_conns: 5

log:
  level: info
  format: json
  sample_first: 100

metrics:
  enable: true
  addr: "0.0.0.0:9201"

shutdown:
  total_timeout: 30s
  drain_timeout: 10s

# 跨服玩法唯一通道（NATS Core）；url 为空则玩法不启用（无 gRPC 降级）
# subject 前缀取 server.env（如 prod.crossplay.score.1.from.game-01），多环境共用集群靠它隔离。
nats:
  url: "nats://127.0.0.1:4222"
  reconnect_wait: "2s"
  max_reconnect: 60
  timeout: "2s"
  # 认证：一个节点一个账号，NATS 侧限定它只能发 "{env}.*.from.{自己}"
  # （见 deploy/nats/nats.conf.example）。本地开发默认不认证，启动日志会有
  # 一条 "nats has no auth" 的 Warn —— 说明任何能连 4222 的进程都能冒充任意节点。
  user: ""
  password: ""
  token: ""
  creds: ""

# 链路追踪（OTel SDK + OTLP gRPC，对接 Tempo/Jaeger）
# 默认关闭：pkg/trace 打点 API 照常可用但为 noop；部署采集端后改为 true。
trace:
  enabled: false
  endpoint: "tempo:4317"
  sample_ratio: 1.0
