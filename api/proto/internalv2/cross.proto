// 内部 gRPC：游戏服 <-> 跨服节点（设计文档 4.5，v3.1 起不连网关）
// 一条流 = 一个游戏服节点，由游戏服主动建立（地址来自中心服 GroupUpdate）。
syntax = "proto3";

package game_study.internal.v2;

option go_package = "game_study/pkg/pb/internalv2;internalv2";

service CrossService {
  rpc Channel(stream CrossFrame) returns (stream CrossFrame);
}

message CrossFrame {
  oneof data {
    PlayerSnapshot snapshot   = 1; // GS→X：玩家进入跨服（token + 战斗快照）
    BattleMsg      battle     = 2; // 双向：战斗消息（GS 代收客户端消息 / X 同步）
    BattleResult   result     = 3; // X→GS：战斗结算（兜底路径；demo 主路径为客户端上报，见 4.9.3）
    CrossCtrl      ctrl       = 4; // 控制消息（房间就绪/关闭、心跳）
    RoomCreateReq  create_req = 5; // GS→X：申请建房（P13 直连路径；P8 后由中心服 MatchAssign 下发）
    RoomCreateResp create_resp = 6; // X→GS：建房结果（room_id + 各玩家准入令牌）
    SeatOp         seat        = 7; // GS→X：抢位置操作（占用/离开）
    SeatReward     seat_reward = 8; // X→GS：座位奖励回推（玩家所在游戏服精确投递）
    SeatState      seat_state  = 9; // X→GS：房间状态全量广播（游戏服缓存后本地查询）
  }
}

// RoomCreateReq 游戏服申请建房。
//
// 两条路径并存：
//   - P13 直连：GS 本地凑够人后直接向 CrossServer 申请（无需中心服，便于独立验证）；
//   - P8 之后：中心服匹配后经 MatchAssign 下发，GS 只负责送快照。
message RoomCreateReq {
  string          req_id         = 1; // 请求关联 ID（GS 侧 pending map 键）
  string          mode           = 2;
  int32           expect_players = 3;
  int32           timeout_sec    = 4;
  repeated int64  player_ids     = 5; // 参战玩家
  // room_id 非 0 时使用中心服分配的号（P8 路径）；0 表示由 CrossServer 自增（P13 直连路径）
  uint64          room_id        = 6;
  // preset_tokens 非空时直接采用（中心服已签发）；为空则由 CrossServer 自行签名
  map<int64, string> preset_tokens = 7;
}

message RoomCreateResp {
  int32           code       = 1; // 0 成功
  string          req_id     = 2; // 回带
  uint64          room_id    = 3;
  map<int64, string> tokens  = 4; // player_id → battle_token
}

message PlayerSnapshot {
  uint64 room_id      = 1; // 中心服分配的房间
  string battle_token = 2; // 中心服签发的准入令牌
  int64  player_id    = 3;
  bytes  snapshot     = 4; // 战斗所需数据（战力/阵容/段位），不含完整状态
}

message BattleMsg {
  uint64 room_id   = 1;
  int64  player_id = 2;
  uint32 msg_id    = 3;
  bytes  body      = 4; // 业务 protobuf（与客户端协议一致，GS 原样透传）
}

message BattleResult {
  uint64 room_id      = 1;
  int64  player_id    = 2;
  int32  result       = 3; // 0 胜 1 负 2 平
  bytes  rewards      = 4; // 奖励明细
  int64  finished_at  = 5;
  // 准入令牌：GS→X 上报路线带上，CrossServer 做纵深校验（防伪造结算）。
  // X→GS 兜底结算路径此字段为空（CrossServer 自身即权威）。
  string battle_token = 6;
}

message CrossCtrl {
  enum Type {
    ROOM_READY  = 0; // X→GS：房间就绪，可推送快照
    ROOM_CLOSED = 1; // 双向：房间关闭
    HEALTH      = 2; // 心跳
    // BIND 必须作为流首帧，用于把连接绑定到具体游戏服节点
    // （CrossServer 据此精确回推结算，不做全网广播）。
    BIND        = 3;
  }
  Type   type    = 1;
  uint64 room_id = 2;
  string node_id = 3; // BIND 帧必填：发起方游戏服节点 ID
}

// SeatOp 抢位置操作（游戏服 → 跨服节点）。
//
// node_id 不在这里传：流首帧 BIND 已确定来源节点，跨服节点按该 node
// 记录占用者归属，奖励回推时才能精确投递到玩家当前所在游戏服。
message SeatOp {
  enum Action {
    OCCUPY = 0; // 占用（空座先到先得 / 已占则抢夺）
    LEAVE  = 1; // 主动离开
  }
  Action action     = 1;
  int32  tier       = 2; // 1=高 2=中 3=低（0 非法）
  int32  room_index = 3;
  int32  seat_index = 4;
  int64  player_id  = 5;
}

// SeatReward 座位奖励回推（跨服节点 → 游戏服）。
message SeatReward {
  int64  player_id = 1;
  int32  tier      = 2; // 1=高 2=中 3=低
  int64  minutes   = 3;
  int64  amount    = 4; // 已算好的奖励数量
  int64  seq       = 5; // 释放事件序号（幂等键）
}

// SeatState 房间状态全量快照（跨服节点 → 所有游戏服）。
//
// 为什么广播全量而不是请求-响应：座位总数固定 100、变更由玩家操作驱动且
// 低频，全量快照只有几 KB；广播让各游戏服本地缓存即可回答查询，省掉
// 「请求 ID + pending 等待」的一整条关联链路，也让客户端能及时看到变化。
message SeatState {
  repeated SeatRoomState rooms = 1;
}

message SeatRoomState {
  int32  tier       = 1; // 1=高 2=中 3=低
  int32  room_index = 2;
  repeated SeatSlotState seats = 3;
}

message SeatSlotState {
  int32 index      = 1;
  int32 state      = 2;
  int64 occupant   = 3;
  int64 remain_sec = 4;
  int64 occupied_at = 5; // 占用起始 unix 秒；游戏服查询时据此实时算倒计时
}
