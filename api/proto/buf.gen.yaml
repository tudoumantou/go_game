version: v1

plugins:
  # Go 消息代码 → pkg/pb/<proto 相对路径>（与设计文档 16.3 对齐）
  - plugin: buf.build/protocolbuffers/go:v1.34.2
    out: ../../pkg/pb
    opt: paths=source_relative
  # gRPC service 代码（GameService.Channel / CrossService.Channel / CenterService.Report）
  - plugin: buf.build/grpc/go:v1.5.1
    out: ../../pkg/pb
    opt: paths=source_relative

  # 消息号注册表不在这里生成：声明方式是 message 上方的 `// @msg <id>` 注解，
  # 由 `make gen-msgid`（tools/genmsgid）直接读 proto 文本产出 pkg/codec/msgids_gen.go。
  # 这样生成链路不绑定 protoc 版本，重复号/重名/越界检查也能独立单测。
