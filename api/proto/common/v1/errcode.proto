// 全服统一错误码（设计文档 4.10，首批 27 个）
// - 协议侧枚举：随生成体系进 pkg/pb，客户端同源生成
// - Go 侧常量与中文文案：internal/common/errcode/errcode.go（文案可热更新，不进 wire）
// - 下发双通道：Resp.code 字段 + ErrorNotify(20) 推送
syntax = "proto3";

package game_study.common.v1;

option go_package = "game_study/pkg/pb/common/v1;commonv1";

enum ErrCode {
  ERR_CODE_OK = 0; // 成功

  // 历史值：早期模块用 1 表示「服务端内部错误」，wire 上已存在，
  // 保持编号不变，仅纳入统一枚举管理（新代码请用 1006）。
  ERR_CODE_SYSTEM = 1; // 服务器内部错误

  // ===== 1xxx 通用/系统 =====
  ERR_CODE_PARAM           = 1001; // 参数错误
  ERR_CODE_TOKEN_EXPIRED   = 1002; // 登录已过期，请重新登录
  ERR_CODE_MAINTENANCE     = 1003; // 服务器维护中
  ERR_CODE_RATE_LIMITED    = 1004; // 操作过于频繁，请稍后再试
  ERR_CODE_SERVER_BUSY     = 1005; // 服务器繁忙（Actor 信箱满/过载保护）

  // ===== 2xxx 登录账号 =====
  ERR_CODE_ACCOUNT_BANNED  = 2001; // 账号已被封禁
  ERR_CODE_KICKED          = 2002; // 账号在其他设备登录
  ERR_CODE_NO_ROLE         = 2003; // 尚未创建角色
  ERR_CODE_NAME_USED       = 2004; // 角色名已被占用
  ERR_CODE_NAME_ILLEGAL    = 2005; // 角色名含非法字符

  // ===== 3xxx 背包道具 =====
  ERR_CODE_ITEM_NOT_EXIST  = 3001; // 道具不存在
  ERR_CODE_ITEM_NOT_ENOUGH = 3002; // 道具数量不足
  ERR_CODE_BAG_FULL        = 3003; // 背包已满
  ERR_CODE_ITEM_NOT_USABLE = 3004; // 道具当前不可使用

  // ===== 4xxx 社交聊天 =====
  ERR_CODE_CHANNEL_CLOSED  = 4001; // 频道未开放
  ERR_CODE_PEER_NOT_FOUND  = 4002; // 对方不在线或不存在
  ERR_CODE_CHAT_TOO_FAST   = 4003; // 发言过于频繁
  ERR_CODE_CHAT_MUTED      = 4004; // 你已被禁言
  ERR_CODE_CONTENT_EMPTY    = 4005; // 内容为空或对端非法
  ERR_CODE_CONTENT_TOO_LONG = 4006; // 内容超长

  // ===== 41xx 场景 =====
  ERR_CODE_SCENE_NOT_EXIST  = 4101; // 场景不存在
  ERR_CODE_SCENE_BUSY       = 4103; // 场景繁忙（Actor 信箱满）
  ERR_CODE_NOT_IN_SCENE     = 4105; // 不在场景中
  ERR_CODE_SCENE_NOT_READY  = 4106; // 场景未就绪

  // ===== 5xxx 邮件 =====
  ERR_CODE_MAIL_NOT_FOUND  = 5001; // 邮件不存在
  ERR_CODE_MAIL_TAKEN      = 5002; // 附件已领取（幂等保护）
  ERR_CODE_NO_ATTACHMENT   = 5003; // 邮件没有附件
  ERR_CODE_MAIL_HAS_UNCLAIMED = 5005; // 附件尚未领取，不能删除

  // ===== 6xxx 战斗 =====
  ERR_CODE_BATTLE_NOT_FOUND       = 6001; // 战斗不存在或已结束
  ERR_CODE_BATTLE_TOKEN_INVALID   = 6002; // 战斗令牌无效
  ERR_CODE_RESULT_REPORTED        = 6003; // 战斗结果已上报（幂等保护）
  ERR_CODE_BATTLE_FULL            = 6004; // 战斗房间已满
  ERR_CODE_RESULT_REWARD_INVALID  = 6005; // 上报的奖励不存在
  ERR_CODE_BATTLE_ALREADY_IN      = 6006; // 已在队列或战斗中
  ERR_CODE_BATTLE_MODE_CLOSED     = 6007; // 玩法未开放（跨服不可用）

  // ===== 61xx 公会 =====
  ERR_CODE_GUILD_NOT_IN       = 6101; // 尚未加入公会
  ERR_CODE_GUILD_NAME_ILLEGAL = 6102; // 公会名不合法
  ERR_CODE_GUILD_NAME_USED    = 6103; // 公会名已被占用
  ERR_CODE_GUILD_ALREADY_IN   = 6104; // 已在公会中
  ERR_CODE_GUILD_FULL         = 6105; // 公会人数已满

  // ===== 62xx 队伍 =====
  ERR_CODE_TEAM_NOT_IN     = 6201; // 不在队伍中
  ERR_CODE_TEAM_ALREADY_IN = 6202; // 已在队伍中
  ERR_CODE_TEAM_NOT_EXIST  = 6203; // 队伍不存在
  ERR_CODE_TEAM_FULL       = 6204; // 队伍人数已满

  // ===== 65xx 活动 =====
  ERR_CODE_ACTIVITY_NOT_EXIST    = 6501; // 活动配置不存在
  ERR_CODE_ACTIVITY_NOT_FINISHED = 6502; // 活动进度未达标
  ERR_CODE_ACTIVITY_CLAIMED      = 6503; // 奖励已领取（幂等保护）
  ERR_CODE_ACTIVITY_BAG_FULL     = 6504; // 背包已满，无法领取奖励
  ERR_CODE_ACTIVITY_NOT_OPEN     = 6505; // 活动不在开放期

  // ===== 66xx 签到 =====
  ERR_CODE_SIGNIN_CONFIG       = 6601; // 签到奖励配置错误
  ERR_CODE_SIGNIN_REWARD_LIMIT = 6602; // 签到奖励数量超出上限
  ERR_CODE_SIGNIN_BAG_FULL     = 6603; // 背包已满，无法领取签到奖励

  // ===== 67xx 排行榜 =====
  ERR_CODE_RANK_BAD_TYPE    = 6701; // 榜单类型非法
  ERR_CODE_RANK_UNAVAILABLE = 6702; // 排行榜暂不可用

  // ===== 68xx 好友 =====
  ERR_CODE_FRIEND_SELF             = 6801; // 不能加自己
  ERR_CODE_FRIEND_TARGET_NOT_FOUND = 6802; // 目标玩家不存在
  ERR_CODE_FRIEND_ALREADY          = 6803; // 已是好友
  ERR_CODE_FRIEND_FULL             = 6804; // 好友已满
  ERR_CODE_FRIEND_APPLY_EXISTS     = 6805; // 已申请，等待对方处理
  ERR_CODE_FRIEND_APPLY_NOT_FOUND  = 6806; // 申请不存在/已处理/已过期
  ERR_CODE_FRIEND_APPLY_FULL       = 6807; // 待处理申请过多
  ERR_CODE_FRIEND_APPLY_EXPIRED    = 6808; // 申请已过期
  ERR_CODE_FRIEND_BLOCK_SELF       = 6809; // 不能拉黑自己
  ERR_CODE_FRIEND_BLOCKED          = 6810; // 已在黑名单（或对方已将你拉黑）

  // ===== 71xx 任务 =====
  ERR_CODE_QUEST_NOT_EXIST   = 7101; // 任务配置不存在
  ERR_CODE_QUEST_ACCEPTED    = 7102; // 任务已接取（幂等保护）
  ERR_CODE_QUEST_UNFINISHED  = 7103; // 任务未完成
  ERR_CODE_QUEST_CLAIMED     = 7104; // 奖励已领取（幂等保护）
  ERR_CODE_QUEST_BAG_FULL    = 7105; // 背包已满，无法领取奖励

  // ===== 31xx 装备 =====
  ERR_CODE_EQUIP_NOT_EXIST     = 3101; // 装备不存在
  ERR_CODE_EQUIP_LEVEL_LOW     = 3102; // 等级不足，无法穿戴
  ERR_CODE_EQUIP_SLOT_CONFLICT = 3103; // 同部位已有装备
  ERR_CODE_EQUIP_NOT_EQUIPPED  = 3104; // 该装备未穿戴
  ERR_CODE_EQUIP_MAX_ENHANCE   = 3105; // 强化已满级
  ERR_CODE_EQUIP_NO_MATERIAL   = 3106; // 强化材料不足

  // ===== 32xx 技能 =====
  ERR_CODE_SKILL_NOT_EXIST    = 3201; // 技能配置不存在
  ERR_CODE_SKILL_LEVEL_LOW    = 3202; // 等级不足，无法学习
  ERR_CODE_SKILL_LEARNED      = 3203; // 该技能已学习（幂等保护）
  ERR_CODE_SKILL_NOT_LEARNED  = 3204; // 尚未学习该技能
  ERR_CODE_SKILL_NO_RESOURCE  = 3205; // 升级材料不足
  ERR_CODE_SKILL_MAX_LEVEL    = 3206; // 已达最高等级

  // ===== 63xx 副本 =====
  ERR_CODE_COPY_NOT_FOUND       = 6301; // 副本配置不存在
  ERR_CODE_COPY_LEVEL_NOT_ENOUGH = 6302; // 等级不足，未解锁该副本
  ERR_CODE_COPY_BAG_FULL        = 6303; // 背包已满，无法领取首通奖励

  // ===== 64xx 商店 =====
  ERR_CODE_SHOP_GOODS_NOT_EXIST    = 6401; // 商品不存在或已下架
  ERR_CODE_SHOP_DIAMOND_NOT_ENOUGH = 6402; // 钻石不足
  ERR_CODE_SHOP_LIMIT_EXCEEDED     = 6403; // 超出限购次数
  ERR_CODE_SHOP_BAG_FULL           = 6404; // 背包已满

  // ===== 69xx 伙伴 =====
  ERR_CODE_PARTNER_NOT_FOUND  = 6901; // 伙伴配置不存在
  ERR_CODE_PARTNER_OWNED      = 6902; // 已拥有该伙伴（幂等保护）
  ERR_CODE_PARTNER_NOT_OWNED  = 6903; // 尚未拥有该伙伴
  ERR_CODE_PARTNER_NO_COIN    = 6904; // 金币不足
  ERR_CODE_PARTNER_MAX_STAR   = 6905; // 已达最高星级
  ERR_CODE_PARTNER_FIELD_FULL = 6906; // 上阵位已满
}
