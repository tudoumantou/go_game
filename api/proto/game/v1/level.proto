// 游戏业务协议：等级/经验（号段 2000-2999）
syntax = "proto3";

package game_study.game.v1;

option go_package = "game_study/pkg/pb/game/v1;gamev1";

// 等级变化推送（升级/获得经验后）
message LevelInfoNotify { // MsgID: 2011 [Push]
  int32 level    = 1; // 当前等级
  int64 exp      = 2; // 当前经验
  int64 exp_max  = 3; // 升到下一级所需经验（满级为 0）
}
