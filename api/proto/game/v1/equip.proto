// 游戏业务协议：装备（号段 3100-3199）
syntax = "proto3";

package game_study.game.v1;

option go_package = "game_study/pkg/pb/game/v1;gamev1";

import "game/v1/player.proto";

message EquipEntry {
  int64 uid           = 1; // 装备实例 ID
  int32 equip_id      = 2; // 配置 ID（equip.xml）
  int32 enhance_level = 3;
  int32 quality       = 4;
  bool  equipped      = 5;
}

message EquipListReq {} // MsgID: 3101

message EquipListResp { // MsgID: 3102
  int32 code = 1;
  repeated EquipEntry equips = 2;
}

message EquipWearReq { // MsgID: 3103
  int64 uid = 1;
}

message EquipWearResp { // MsgID: 3104
  int32 code = 1; // 3101 不存在 / 3102 等级不足 / 3103 部位冲突
  repeated AttrPair attrs = 2; // 穿戴后属性全量
}

message EquipTakeOffReq { // MsgID: 3105
  int64 uid = 1;
}

message EquipTakeOffResp { // MsgID: 3106
  int32 code = 1;
  repeated AttrPair attrs = 2;
}
