// 七日签到（6600-6699）：周一至周日循环，业务日期固定使用北京时间。
// 周切换的清零由周期回调模块负责，本模块只提供信息与领取。
syntax = "proto3";

package game_study.game.v1;

option go_package = "game_study/pkg/pb/game/v1;gamev1";

message SigninReward {
  int32 item_id = 1;
  int64 count = 2;
}

// @msg 6601
message SigninInfoReq {} // MsgID: 6601
// @msg 6602
message SigninInfoResp { // MsgID: 6602
  int32 code = 1; // 0 成功；1 系统错误。
  int32 today = 2; // 今天周几，1=周一…7=周日。
  bool claimed_today = 3;
  repeated int32 claimed_days = 4; // 本周已领取天数，升序。
  map<int32, int64> claimed_rewards = 5; // 本周已领取奖励汇总 {item_id:count}。
}

// @msg 6603
message SigninClaimReq {} // MsgID: 6603
// @msg 6604
message SigninClaimResp { // MsgID: 6604
  int32 code = 1; // 0 成功（重复请求也成功）；6601 配置错误；6602 背包数量超限；1 系统错误。
  bool already = 2; // 今天已领过，不再发奖。
  int32 day = 3; // 本次领取的天数，1=周一…7=周日。
  repeated SigninReward rewards = 4; // 当天的奖励。
  repeated int32 claimed_days = 5;
  map<int32, int64> claimed_rewards = 6;
}
