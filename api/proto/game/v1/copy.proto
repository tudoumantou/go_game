// 游戏业务协议：副本（号段 6300-6399）
syntax = "proto3";

package game_study.game.v1;

option go_package = "game_study/pkg/pb/game/v1;gamev1";

message CopyEntry {
  int32  copy_id    = 1;
  string name       = 2;
  int32  min_level  = 3;
  int32  best_star  = 4;
  int32  pass_count = 5;
}

message CopyListReq {} // MsgID: 6301

message CopyListResp { // MsgID: 6302
  int32 code = 1;
  repeated CopyEntry copies = 2;
}

message CopySettleReq { // MsgID: 6303
  int32 copy_id = 1;
  int32 star    = 2; // 本次星级 1-3
}

message CopySettleResp { // MsgID: 6304
  int32 code       = 1; // 6301 不存在 / 6302 等级不足
  bool  first_pass = 2; // 是否首通（首通发奖）
  int64 exp_gain   = 3;
  bytes rewards    = 4; // BagChangeNotify
}
