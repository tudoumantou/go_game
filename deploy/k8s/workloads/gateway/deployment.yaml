apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 3
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          image: game-study/gateway:dev
          args: ["-config", "/app/configs/gateway/gateway-dev.yaml"]
          ports:
            - { name: tcp,    containerPort: 9001 }
            - { name: metrics, containerPort: 9101 }
          volumeMounts:
            - { name: config, mountPath: /app/configs/gateway, readOnly: true }
            - { name: keys,   mountPath: /app/keys, readOnly: true }
          # 19.6 探针表（P7 已实现）：存活看进程，就绪看是否可接新连接
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:       # 18.4 排水 30s：摘流 → 存量连接处理完再退出
              exec: { command: ["sleep", "30"] }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
      volumes:
        - name: config
          configMap: { name: gateway-config }
        - name: keys
          secret:    { secretName: rsa-secret }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    metrics: enabled
spec:
  selector: { app: gateway }
  ports:
    - { name: tcp,     port: 9001, targetPort: tcp }
    - { name: metrics, port: 9101, targetPort: metrics }
  type: LoadBalancer
