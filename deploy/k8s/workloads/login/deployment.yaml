apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels: { app: login }
spec:
  replicas: 2
  selector:
    matchLabels: { app: login }
  template:
    metadata:
      labels: { app: login }
    spec:
      containers:
        - name: login
          image: game-study/login:dev
          args: ["-config", "/app/configs/login/login-dev.yaml"]
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: metrics, containerPort: 8081 }
          env:
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
          volumeMounts:
            - { name: config, mountPath: /app/configs/login, readOnly: true }
          # 19.6 探针表（P7 已实现）：/readyz 校验 Redis + MySQL
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: login-config }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-hpa
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: login }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: v1
kind: Service
metadata:
  name: login
  labels:
    app: login
    metrics: enabled
spec:
  selector: { app: login }
  ports:
    - { name: http,    port: 8080, targetPort: http }
    - { name: metrics, port: 8081, targetPort: metrics }
