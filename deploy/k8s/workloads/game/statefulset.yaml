apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: game
  labels: { app: game }
spec:
  # 19.6：游戏服有状态（Actor 绑定玩家，不做热迁移），固定 10~20，手动/脚本扩缩
  replicas: 10
  serviceName: game-headless
  selector:
    matchLabels: { app: game }
  template:
    metadata:
      labels: { app: game }
    spec:
      # 18 章优雅关闭全流程：DRAIN→DRAINING→FLUSH→STOP 需要时间，>=120s
      terminationGracePeriodSeconds: 120
      containers:
        - name: game
          image: game-study/game:dev
          args: ["-config", "/app/configs/game/game-dev.yaml"]
          ports:
            - { name: grpc,    containerPort: 9100 }
            - { name: metrics, containerPort: 9102 }
          env:
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
          volumeMounts:
            - { name: config, mountPath: /app/configs/game, readOnly: true }
          # 19.6 探针表（P7 已实现）：
          #   /healthz 存活：进程活着即 200，不查依赖（避免中间件抖动引发重启风暴）
          #   /readyz  就绪：MySQL + Redis 可用才 200，不通则从 Endpoints 摘除
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
            failureThreshold: 60      # 最多等 5 分钟（大区数据加载）
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "2",   memory: "4Gi" }
            limits:   { cpu: "4",   memory: "8Gi" }
      volumes:
        - name: config
          configMap: { name: game-config }
---
apiVersion: v1
kind: Service
metadata:
  name: game-headless
  labels:
    app: game
    metrics: enabled
spec:
  clusterIP: None
  selector: { app: game }
  ports:
    - { name: grpc,    port: 9100, targetPort: grpc }
    - { name: metrics, port: 9102, targetPort: metrics }
