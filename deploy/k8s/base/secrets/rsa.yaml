# base/secrets/rsa.yaml —— 网关握手 RSA 私钥（19.6：密钥挂载为文件，禁止打进镜像）
# 由 make keygen 生成 deploy/keys 后，用 kubectl create secret generic 或
# external-secrets 注入；此处仅占位声明结构。
apiVersion: v1
kind: Secret
metadata:
  name: rsa-secret
stringData:
  gateway_rsa: ""   # dev 占位：make keygen && kubectl create secret generic rsa-secret --from-file=gateway_rsa=deploy/keys/gateway_rsa
type: Opaque
