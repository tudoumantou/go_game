# deploy/docker-compose.yaml —— 本地全栈（设计文档 19.4）
# 用法:
#   make dev        # 只起中间件（etcd/redis/mysql/kafka）
#   make db-init && make db-seed
#   make run-all    # 或 docker compose up 五服务（需先构建镜像）
# volumes/ 持久化 MySQL 数据；配置与密钥只读挂载，不进镜像。
services:
  etcd:
    image: bitnami/etcd:3.5
    ports: ["2379:2379"]
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12

  mysql:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: game_study
      MYSQL_DATABASE: game_study
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092", "9093:9093"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9094"
      # 双 listener：INTERNAL 供 compose 内服务（kafka:9092），EXTERNAL 供宿主机/本地测试（localhost:9093）
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      retries: 12

  login:
    build:
      context: .
      dockerfile: ./deploy/docker/login.Dockerfile
    ports: ["8080:8080"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
    volumes:
      - ./configs:/app/configs:ro
      - ./deploy/keys:/app/keys:ro
    command: ["-config", "/app/configs/login/login-dev.yaml"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: ./deploy/docker/gateway.Dockerfile
    ports: ["9001:9001"]
    volumes:
      - ./configs:/app/configs:ro
      - ./deploy/keys:/app/keys:ro
    command: ["-config", "/app/configs/gateway/gateway-dev.yaml"]
    depends_on: [login]

  game:
    build:
      context: .
      dockerfile: ./deploy/docker/game.Dockerfile
    ports: ["9100:9100"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
    volumes:
      - ./configs:/app/configs:ro
      - ./deploy/keys:/app/keys:ro
    command: ["-config", "/app/configs/game/game-dev.yaml"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  center:
    build:
      context: .
      dockerfile: ./deploy/docker/center.Dockerfile
    ports: ["9200:9200"]
    volumes:
      - ./configs:/app/configs:ro
    command: ["-config", "/app/configs/center/center-dev.yaml"]
    depends_on: [etcd]

  cross:
    build:
      context: .
      dockerfile: ./deploy/docker/cross.Dockerfile
    ports: ["9300:9300"]
    volumes:
      - ./configs:/app/configs:ro
    command: ["-config", "/app/configs/cross/cross-dev.yaml"]
    depends_on: [center]

volumes:
  mysql:
