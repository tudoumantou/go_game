# deploy/monitoring/grafana/provisioning/datasources/prometheus.yml
# Grafana 启动时自动注册 Prometheus 数据源（uid 与 dashboard 中的 "prometheus" 对应）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
