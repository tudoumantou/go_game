# .github/workflows/ci.yaml —— CI 五步卡点（设计文档 16.4）
# 任一步失败即阻断合并：生成体系的可信度靠 CI 强制保证。
#
# 版本锁说明：
#   - buf 锁 1.74.0：与本地开发版本一致，避免生成输出随版本漂移导致 ① gen diff 误报
#   - golangci-lint 锁 v1 大版本（v1.64.8）：v2 要求 go >= 1.23，与 go.mod 的 1.22 不兼容
#   - Go 1.22：与 go.mod 指令一致（GOTOOLCHAIN 不会触发额外下载）
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags 需要完整历史（scripts/build.sh 版本注入）

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.74.0"

      # ① 生成物一致性：make gen 后 git diff 必须干净（杜绝手改生成代码）
      - name: "① gen + diff"
        run: |
          make gen
          git diff --exit-code -- pkg/pb pkg/gamedata pkg/model

      # ② buf lint + proto 兼容性检查
      - name: "② buf lint"
        run: |
          cd api/proto
          buf lint

      # ③ golangci-lint run
      - name: "③ golangci-lint"
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      # ④ go test（含 test/integration，testcontainers 起真实中间件，23.3；
      #   ubuntu-latest runner 自带 Docker，超时放宽到 15m 覆盖镜像拉取）
      - name: "④ go test (unit + integration)"
        run: go test -tags=integration ./... -count=1 -timeout 15m

      # ⑤ 交叉编译五服务
      - name: "⑤ build.sh"
        run: ./scripts/build.sh linux amd64
